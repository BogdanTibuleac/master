experiment_name: baseline_lightgbm
random_seed: 42

data:
  train_path: data/processed/train.parquet
  validation_path: data/processed/validation.parquet
  test_path: data/processed/test.parquet
  label_column: label

model:
  objective: binary
  learning_rate: 0.05
  num_leaves: 31
  n_estimators: 300

evaluation:
  decision_threshold: 0.5
