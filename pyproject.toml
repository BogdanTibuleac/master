[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malware-robustness"
version = "0.1.0"
description = "Reproducible evaluation of static malware classifier robustness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.5,<5",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.6,<1"]

[project.scripts]
malware-data = "malware_robustness.ember2018:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
